name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc git
      - name: Rodar os testes do cbrasil
        run: sh tests/test.sh
